services:
  - type: web
    name: kurt-api
    env: node
    rootDir: api
    buildCommand: "npm install"
    startCommand: "npm start"


  - type: web
    name: kurt-dashboard
    env: node
    rootDir: dashboard
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NEXT_PUBLIC_BOT_URL
        value: "http://192.168.78.15:3001"


  - type: worker
    name: kurt-bot
    env: node
    rootDir: bot
    buildCommand: "npm install"
    startCommand: "node bot.js"
