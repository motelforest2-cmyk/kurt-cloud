services:
  - type: web
    name: kurt-api
    env: node
    rootDir: api
    buildCommand: "npm install"
    startCommand: "npm start"

  - type: web
    name: kurt-dashboard
    env: node
    rootDir: dashboard
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"

  - type: worker
    name: kurt-bot
    env: node
    rootDir: bot
    buildCommand: "npm install"
    startCommand: "node index.js"
